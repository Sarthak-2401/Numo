

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: numo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - numo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: numo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - numo-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: numo-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      EXTERNAL_SMTP_USER: ${EXTERNAL_SMTP_USER:-}
      EXTERNAL_SMTP_PASS: ${EXTERNAL_SMTP_PASS:-}
      RECOVERY_TEST_SMTP_HOST: ${RECOVERY_TEST_SMTP_HOST:-}
      NODE_ENV: ${NODE_ENV}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - numo-network

  mailpit:
    image: axllent/mailpit:v1.22.3
    profiles: ["mail-testing"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - numo-network

  # SMTP Server
  smtp-server:
    build:
      context: ./smtp-server
      dockerfile: Dockerfile
    container_name: numo-smtp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
    ports:
      - "2525:2525"
      - "587:587"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - numo-network
    extra_hosts:
      - "aws-0-ap-southeast-2.pooler.supabase.com:13.238.183.126"

  # Web Client
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: numo-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - numo-network

volumes:
  postgres_data:
  redis_data:

networks:
  numo-network:
    driver: bridge
